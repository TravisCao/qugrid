<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640" font-family="Avenir Next, Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="QuGrid three-layer architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="640" fill="#fcfcfb"/>

  <!-- inputs -->
  <g font-size="13" fill="#0b0b0b">
    <rect x="60" y="18" width="150" height="30" rx="15" fill="#f0efec" stroke="#c3c2b7"/>
    <text x="135" y="38" text-anchor="middle">MATPOWER case.m</text>
    <rect x="230" y="18" width="130" height="30" rx="15" fill="#f0efec" stroke="#c3c2b7"/>
    <text x="295" y="38" text-anchor="middle">pandapower net</text>
    <rect x="380" y="18" width="190" height="30" rx="15" fill="#f0efec" stroke="#c3c2b7"/>
    <text x="475" y="38" text-anchor="middle">bundled cases 5–118 bus</text>
  </g>
  <g stroke="#898781" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M135 48 L135 74" fill="none"/>
    <path d="M295 48 L295 74" fill="none"/>
    <path d="M475 48 L475 74" fill="none"/>
  </g>

  <!-- Network strip -->
  <rect x="48" y="78" width="560" height="38" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="328" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Network — buses · branches · generators · Ybus / B′ (MATPOWER semantics)</text>
  <path d="M328 116 L328 142" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- Layer 1 -->
  <rect x="30" y="146" width="640" height="118" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="46" y="170" font-size="15" font-weight="700" fill="#2a78d6">1 · Power problems</text>
  <text x="230" y="170" font-size="12.5" fill="#52514e">engineering units in, engineering units out</text>
  <g font-size="12.5" fill="#0b0b0b">
    <rect x="46" y="182" width="128" height="26" rx="13" fill="#f0efec"/><text x="110" y="199" text-anchor="middle">UnitCommitment</text>
    <rect x="182" y="182" width="80" height="26" rx="13" fill="#f0efec"/><text x="222" y="199" text-anchor="middle">Islanding</text>
    <rect x="270" y="182" width="112" height="26" rx="13" fill="#f0efec"/><text x="326" y="199" text-anchor="middle">PMUPlacement</text>
    <rect x="390" y="182" width="164" height="26" rx="13" fill="#f0efec"/><text x="472" y="199" text-anchor="middle">EconomicDispatchQUBO</text>
    <rect x="46" y="216" width="116" height="26" rx="13" fill="#f0efec"/><text x="104" y="233" text-anchor="middle">dc_power_flow</text>
    <rect x="170" y="216" width="182" height="26" rx="13" fill="#f0efec"/><text x="261" y="233" text-anchor="middle">newton_with_linear_solver</text>
    <rect x="360" y="216" width="140" height="26" rx="13" fill="#f0efec"/><text x="430" y="233" text-anchor="middle">screening_dataset</text>
    <rect x="508" y="216" width="118" height="26" rx="13" fill="#f0efec"/><text x="567" y="233" text-anchor="middle">wind scenarios</text>
  </g>
  <path d="M350 264 L350 290" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- Layer 2 -->
  <rect x="30" y="294" width="640" height="92" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
  <text x="46" y="318" font-size="15" font-weight="700" fill="#0b0b0b">2 · Encodings</text>
  <text x="180" y="318" font-size="12.5" fill="#52514e">exact algebra, 1e-9-tested, hardware-agnostic</text>
  <g font-size="13" fill="#0b0b0b">
    <rect x="46" y="330" width="290" height="40" rx="8" fill="#f0efec" stroke="#c3c2b7"/>
    <text x="191" y="349" text-anchor="middle" font-weight="600">QUBO ⇄ Ising</text>
    <text x="191" y="364" text-anchor="middle" font-size="11.5" fill="#52514e">min xᵀQx · s = 1−2x · QUBOBuilder penalties</text>
    <rect x="356" y="330" width="290" height="40" rx="8" fill="#f0efec" stroke="#c3c2b7"/>
    <text x="501" y="349" text-anchor="middle" font-weight="600">LinearSystemProblem</text>
    <text x="501" y="364" text-anchor="middle" font-size="11.5" fill="#52514e">A x = b · power-of-two padding · Hermitian dilation</text>
  </g>
  <path d="M350 386 L350 412" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- Layer 3 -->
  <rect x="30" y="416" width="640" height="130" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
  <text x="46" y="440" font-size="15" font-weight="700" fill="#eb6834">3 · Solvers</text>
  <text x="130" y="440" font-size="12.5" fill="#52514e">pure-NumPy statevector core (≤ 22 qubits), no quantum SDK required</text>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="46" y="466" font-weight="600">Quantum optimization</text>
    <rect x="46" y="474" width="62" height="24" rx="12" fill="#fde3d7"/><text x="77" y="490" text-anchor="middle">QAOA</text>
    <rect x="114" y="474" width="52" height="24" rx="12" fill="#fde3d7"/><text x="140" y="490" text-anchor="middle">VQE</text>
    <text x="240" y="466" font-weight="600">Quantum linear</text>
    <rect x="240" y="474" width="52" height="24" rx="12" fill="#fde3d7"/><text x="266" y="490" text-anchor="middle">HHL</text>
    <rect x="298" y="474" width="58" height="24" rx="12" fill="#fde3d7"/><text x="327" y="490" text-anchor="middle">VQLS</text>
    <text x="420" y="466" font-weight="600">Quantum ML</text>
    <rect x="420" y="474" width="102" height="24" rx="12" fill="#fde3d7"/><text x="471" y="490" text-anchor="middle">fidelity kernel</text>
    <rect x="530" y="474" width="52" height="24" rx="12" fill="#fde3d7"/><text x="556" y="490" text-anchor="middle">QBM</text>
    <text x="46" y="520" font-weight="600" fill="#008300">Classical baselines, always in the same run:</text>
    <text x="342" y="520" fill="#0b0b0b">exact enumeration · simulated annealing · LU · Newton–Raphson</text>
  </g>

  <!-- adapters column -->
  <rect x="700" y="146" width="210" height="240" rx="10" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
  <text x="716" y="170" font-size="15" font-weight="700" fill="#4a3aa7">Adapters</text>
  <text x="716" y="188" font-size="11.5" fill="#52514e">same encodings, real stacks</text>
  <g font-size="12.5" fill="#0b0b0b">
    <rect x="716" y="200" width="178" height="26" rx="13" fill="#f0efec"/><text x="805" y="217" text-anchor="middle">Qiskit SparsePauliOp</text>
    <rect x="716" y="234" width="178" height="26" rx="13" fill="#f0efec"/><text x="805" y="251" text-anchor="middle">D-Wave dimod BQM</text>
    <rect x="716" y="268" width="178" height="26" rx="13" fill="#f0efec"/><text x="805" y="285" text-anchor="middle">PennyLane Hamiltonian</text>
    <text x="805" y="330" text-anchor="middle" font-size="11.5" fill="#52514e">simulators today,</text>
    <text x="805" y="346" text-anchor="middle" font-size="11.5" fill="#52514e">hardware when you have it</text>
  </g>
  <path d="M672 340 L696 340" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <!-- results strip -->
  <rect x="30" y="574" width="880" height="46" rx="10" fill="#e7f5ef" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="470" y="596" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">Result — decoded engineering answer · gap vs classical optimum · success probability · qubit/runtime resources</text>
  <text x="470" y="612" text-anchor="middle" font-size="12" fill="#52514e">bench.sweep → tidy DataFrame → LaTeX table · viz.plot_network / convergence / schedules</text>
  <path d="M350 546 L350 570" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <path d="M805 390 L805 470 L680 570" stroke="#898781" stroke-width="1.5" marker-end="url(#arr)" fill="none" opacity="0.7"/>
</svg>
