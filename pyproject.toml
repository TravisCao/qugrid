[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qugrid"
version = "0.1.0"
description = "Quantum computing for power system research: from a MATPOWER case to a quantum algorithm in three lines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "QuGrid Developers" }]
requires-python = ">=3.10"
keywords = [
    "quantum computing",
    "power systems",
    "smart grid",
    "QAOA",
    "QUBO",
    "power flow",
    "unit commitment",
    "quantum annealing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
dwave = ["dimod>=0.12"]
pennylane = ["pennylane>=0.35"]
pandapower = ["pandapower>=2.14"]
all = [
    "qiskit>=1.0",
    "dimod>=0.12",
    "pennylane>=0.35",
    "pandapower>=2.14",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
qugrid = "qugrid.cli:main"

[project.urls]
Homepage = "https://github.com/TravisCao/qugrid"
Documentation = "https://traviscao.github.io/qugrid/"
Repository = "https://github.com/TravisCao/qugrid"
Issues = "https://github.com/TravisCao/qugrid/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qugrid"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905", "B007"]  # zip-strict / loop-var noise in numerical code

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:pandapower.*"]
